name: CD Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Incrementar versión en README.md
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          CURRENT_VER=$(grep -oE 'AppVersion-[0-9]+' README.md | tail -1 | cut -d'-' -f2)
          if [ -z "$CURRENT_VER" ]; then CURRENT_VER=0; fi
          NEXT_VER=$((CURRENT_VER + 1))
          sed -i "s/AppVersion-$CURRENT_VER/AppVersion-$NEXT_VER ($TIMESTAMP)/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to AppVersion-$NEXT_VER [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Sin cambios en README.md"
          fi

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - name: Validar PROD_TOKEN contra LOCAL_PROD_TOKEN
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          $localProd = [System.Environment]::GetEnvironmentVariable('LOCAL_PROD_TOKEN', 'User')
          Write-Host "Comprobando PROD_TOKEN..."
          if ($env:PROD_TOKEN -eq $localProd) {
              Write-Host "Tokens de produccion coinciden perfectamente."
              exit 0
          }
          Write-Error "ERROR: PROD_TOKEN no coincide con LOCAL_PROD_TOKEN."
          exit 1

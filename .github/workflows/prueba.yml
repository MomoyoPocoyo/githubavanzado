name: Comparar Tokens

on:
  push:

jobs:
  comparar:
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          $localDev = [System.Environment]::GetEnvironmentVariable('LOCAL_DEV_TOKEN', 'User')
          Write-Host "DEV_TOKEN recibido del secret: $env:DEV_TOKEN"
          Write-Host "LOCAL_DEV_TOKEN leido de la maquina: $localDev"
          if ($env:DEV_TOKEN -eq $localDev) {
            Write-Host "Los tokens coinciden perfectamente."
            exit 0
          } else {
            Write-Error "ERROR: Los tokens no coinciden."
            exit 1
          }


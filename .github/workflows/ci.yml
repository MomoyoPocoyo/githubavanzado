name: CI Develop

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Actualizar README.md
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Añadida feature: $BRANCH_NAME" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: actualizar README con feature $BRANCH_NAME" && git push)

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN contra LOCAL_DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          $localDev = [System.Environment]::GetEnvironmentVariable('LOCAL_DEV_TOKEN', 'User')
          Write-Host "Comprobando DEV_TOKEN..."
          if ($env:DEV_TOKEN -eq $localDev) {
            Write-Host "Tokens de desarrollo coinciden perfectamente."
            exit 0
          } else {
            Write-Error "ERROR: DEV_TOKEN no coincide con LOCAL_DEV_TOKEN."
            exit 1
          }
